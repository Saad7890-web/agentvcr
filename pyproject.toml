[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentvcr"
dynamic = ["version"]
description = "VCR for AI agents: record, replay, fork and diff any agent run through a drop-in LLM proxy."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "agentvcr contributors" }]
keywords = ["llm", "agents", "proxy", "record", "replay", "debugging", "openai", "anthropic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  # 0.13 and older cannot render a single `--help` against click 8.4: make_metavar()
  # grew a required argument. 0.12 cannot even build the CLI, which annotates its
  # options `str | None`. Both were declared supported until the floors job ran.
  "typer>=0.14",
  "tomli>=2.0; python_version < '3.11'",
]
# No upper bounds. They would not have caught the one incompatibility this project has
# actually hit -- a 0.x minor of typer against a new click, which no `<1` would exclude --
# and they make agentvcr uninstallable beside anything that upgraded first. The CI floors
# job is the guard instead: it installs the oldest of each bound above and runs the suite.

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
agentvcr = "agentvcr.cli:main"

[project.urls]
Homepage = "https://github.com/Saad7890-web/agentvcr"
Source = "https://github.com/Saad7890-web/agentvcr"
Issues = "https://github.com/Saad7890-web/agentvcr/issues"

[tool.hatch.version]
path = "src/agentvcr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentvcr"]
# The web UI is built into the package by CI and is gitignored, so it has to be named
# as an artifact or hatchling would leave it out of the wheel (PLAN.md phase 5).
artifacts = ["src/agentvcr/ui_dist/**"]

[tool.hatch.build.targets.sdist]
include = ["src/agentvcr", "ui", "tests", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["ui/node_modules", "ui/dist"]
# The sdist carries the built bundle as well as the ui/ sources it came from. `python -m
# build` builds the wheel *from the sdist*, so a bundle left out here is a bundle missing
# from the wheel — and installing from an sdist would otherwise need Node to get a UI.
artifacts = ["src/agentvcr/ui_dist/**"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Recent ruff reformats Python blocks inside Markdown; the docs are hand-written.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.flake8-bugbear]
# typer declares CLI options as call-valued argument defaults; that is its API.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
