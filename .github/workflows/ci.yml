name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest

  # The lower bounds in pyproject are a promise, and `pip install -e .` never tests it:
  # it resolves to the newest of everything, so a floor that quietly stopped working is
  # discovered by a user rather than by CI. Two of them had (typer, PLAN.md phase 6).
  # The numbers are read out of pyproject so there is only ever one copy of them.
  floors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: pin every dependency to the oldest version pyproject allows
        run: |
          python - > floors.txt <<'PY'
          import re
          from pathlib import Path

          block = re.search(
              r"\ndependencies = \[(.*?)\n\]", Path("pyproject.toml").read_text(), re.S
          ).group(1)
          for raw in re.findall(r'"([^"]+)"', block):
              spec, _, marker = raw.partition(";")
              name, bound, low = spec.partition(">=")
              if bound:
                  print(f"{name.strip()}=={low.strip()}" + (f" ;{marker}" if marker else ""))
          PY
          cat floors.txt
          pip install -r floors.txt
      - run: pytest

  # The only check that goes through the real CLI, a real socket and a real SDK.
  # It is also the script the launch GIF is recorded from, so it must not rot.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]' openai
      - run: python examples/fork-demo/demo.py

  # The wheel carries the web UI prebuilt, so this job needs Node as well as Python —
  # `pip install agentvcr` must never require a JavaScript toolchain (PLAN.md phase 5).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: the bundle is in the wheel
        run: python -c "import glob, zipfile, sys; names = zipfile.ZipFile(sorted(glob.glob('dist/*.whl'))[-1]).namelist(); sys.exit(0 if 'agentvcr/ui_dist/index.html' in names else 'the wheel has no UI bundle')"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
